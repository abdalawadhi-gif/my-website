<!DOCTYPE html>
<html>
<head>
  <title>Booking</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2>Book Appointment</h2>

  <form id="form">
    <input type="text" id="name" placeholder="Your Name" required><br><br>
    <input type="tel" id="phone" placeholder="Phone Number" required><br><br>
    <input type="date" id="date" required><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="msg"></p>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCrvo3Psaijl5vQaNVJMhDuE7W-3rE--q4",
      authDomain: "clinic-app-6ffa8.firebaseapp.com",
      projectId: "clinic-app-6ffa8",
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();

      await db.collection("bookings").add({
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        date: document.getElementById("date").value,
        createdAt: new Date()
      });

      document.getElementById("msg").innerText = "Booking saved!";
    });
  </script>

</body>
</html>
